    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;500;700&family=MedievalSharp&display=swap');

      body {
        font-family: 'Inter', sans-serif; /* Modern, readable font for UI */
        background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
        color: #e0e0e0; /* Light gray for text */
        overflow-x: hidden; /* Allow vertical scroll, prevent horizontal */
      }

      .font-cinzel {
        font-family: 'Cinzel', serif; /* For headings and titles */
      }
      .font-medievalsharp {
        font-family: 'MedievalSharp', cursive; /* For specific thematic text like DM narration */
      }

      /* Custom scrollbar for webkit browsers - more thematic */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.2); /* Dark, slightly transparent track */
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #4a5568, #2d3748); /* Dark gray gradient */
        border-radius: 10px;
        border: 2px solid rgba(0,0,0,0.2);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #718096, #4a5568); /* Lighter gray gradient on hover */
      }

      /* Glassmorphism helper class */
      .glassmorphic {
        background: rgba(31, 41, 55, 0.6); /* bg-gray-700 with opacity */
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
    </style>
